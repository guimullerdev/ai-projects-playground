<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="popover">
      <div class="hero">
        <div class="hero-icon" id="hero-icon">○</div>
        <div>
          <div class="hero-label" id="hero-label">Carregando…</div>
          <div class="hero-sub" id="hero-sub"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-tile">
          <div class="stat-value" id="stat-streak">–</div>
          <div class="stat-label">Streak atual</div>
        </div>
        <div class="stat-tile">
          <div class="stat-value" id="stat-longest">–</div>
          <div class="stat-label">Maior streak</div>
        </div>
      </div>

      <div>
        <p class="section-title">Commits de hoje</p>
        <ul class="commit-list" id="commit-list"></ul>
      </div>

      <div id="pending-block" hidden>
        <p class="section-title">Trabalho pendente</p>
        <ul class="commit-list" id="pending-list"></ul>
      </div>

      <div class="actions">
        <button id="btn-snooze">Soneca 1h</button>
        <button id="btn-rescan">Rescan</button>
      </div>

      <button id="btn-open-main" class="link-button">Abrir janela completa</button>
    </div>
    <script src="js/popover.js"></script>
  </body>
</html>
